  --bg:#f3ead4; --surface:#fbf6e8; --sunk:#e9dec2; --ink:#1b2a21; --muted:#5b5440; --line:#c9b27a;
  --accent:#12432f; --accent-ink:#f6e9c4; --accent-soft:#dde5d0;
  --red:#8c2a1c; --red-soft:#f1dcd2; --gold:#a07a22; --blue:#1f3a6a; --brass:#b8963e; --forest:#0f3a29;

  --accent:#0f3d2b; --accent-ink:#f6e9c4; --accent-soft:#dfe5cf;
  --red:#7d1f22; --red-soft:#f0d9d2; --gold:#9a7420; --blue:#1f3a6a; --brass:#b08a35; --forest:#0c3122; --wine:#6e1c22;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"EB Garamond",Georgia,"Times New Roman",serif;
  --caps:"Cinzel","Trajan Pro",Georgia,serif}
:root.t-anthropic-green{
  --bg:#f0eee6; --surface:#faf9f5; --sunk:#e8e6dc; --ink:#141413; --muted:#5e5d59; --line:#d6d3c6;
  --accent:#4f6a3a; --accent-ink:#ffffff; --accent-soft:#e2e8d6;
  --red:#b0472c; --red-soft:#f4dfd5; --gold:#9a6c00; --blue:#3b64a0;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
:root.t-mulligan{
  --bg:#f3f4ef; --surface:#ffffff; --sunk:#e7e9e2; --ink:#0b130e; --muted:#454f48; --line:#cdd2c8;
  --accent:#0a7a3d; --accent-ink:#ffffff; --accent-soft:#eefbc4;
  --red:#dc2f1c; --red-soft:#fde3df; --gold:#a26c00; --blue:#1b52cc;
  --volt:#d4ff3a; --dock:#0b130e; --dock-muted:#a3ada6;
  --blk:#0b130e; --on-blk:#d4ff3a; --on-blk2:#ffffff; --on-volt:#0b130e; --done-line:#c9e27a}
:root.t-mulligan-dark{
  --bg:#0b120d; --surface:#151e18; --sunk:#202b23; --ink:#eef2ea; --muted:#a8b3aa; --line:#2b3830;
  --accent:#3ddc7e; --accent-ink:#06170e; --accent-soft:#273312;
  --red:#ff6b55; --red-soft:#3d1f19; --gold:#e8b53a; --blue:#7aa2ff;
  --volt:#d4ff3a; --dock:#050906; --dock-muted:#8c978f;
  --blk:#d4ff3a; --on-blk:#0b130e; --on-blk2:#0b130e; --on-volt:#0b130e; --done-line:#55661f; color-scheme:dark}
:root.t-sand-dark{
  --bg:#0d1a1e; --surface:#13252a; --sunk:#1b3137; --ink:#e9f1ef; --muted:#9db3b2; --line:#26404a;
  --accent:#3fb7c6; --accent-ink:#04191c; --accent-soft:#163a40;
  --red:#ff7a5c; --red-soft:#3d211a; --gold:#e2b43a; --blue:#79a6f0; color-scheme:dark}
:root.t-anthropic-dark,:root.t-anthropic-green-dark{
  --bg:#1f1e1d; --surface:#262624; --sunk:#30302e; --ink:#f0eee6; --muted:#a6a39a; --line:#3a3936;
  --accent:#d97757; --accent-ink:#1f1e1d; --accent-soft:#3d2a22;
  --red:#e2795a; --red-soft:#3b231c; --gold:#d4a440; --blue:#7fa2d9;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; color-scheme:dark}
:root.t-anthropic-green-dark{--accent:#8fae6f; --accent-soft:#2b3424}
:root.t-anthropic{
  --bg:#f0eee6; --surface:#faf9f5; --sunk:#e8e6dc; --ink:#141413; --muted:#5e5d59; --line:#d6d3c6;
  --accent:#c6613f; --accent-ink:#ffffff; --accent-soft:#f4dfd5;
  --red:#a8402c; --red-soft:#f2dcd4; --gold:#9a6c00; --blue:#3b64a0;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent)}
.themesel{flex:none;max-width:156px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:0 8px;font-size:14px;font-weight:600}
.round-meta{font-size:13px;color:var(--muted);text-align:right;line-height:1.25;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding-block:14px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:12px 2px 10px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:3px solid transparent}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:6px 10px;font-size:14px}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* hoyo */
.hole-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hole-no{font-family:var(--display);font-weight:700;font-size:56px;line-height:.9}
.hole-no small{font-size:20px;color:var(--muted);font-weight:600;margin-right:4px}
.hole-facts{display:flex;gap:16px;text-align:right}
.fact{display:flex;flex-direction:column}
.fact .num{font-size:24px;font-weight:600;line-height:1}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.strip button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-family:var(--display);font-weight:600;font-size:16px;position:relative}
.strip button.done{background:var(--accent-soft);border-color:transparent}
.strip button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.p-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.p-name{font-weight:600;font-size:18px}
.p-tot{font-size:13px;color:var(--muted)}
.score-row{display:flex;align-items:center;gap:10px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{width:46px;height:46px;border:0;background:var(--sunk);font-size:24px;font-weight:600}
.step .val{min-width:52px;height:46px;border:0;background:var(--surface);font-family:var(--display);font-weight:700;font-size:30px;text-align:center}
.step.sm button{width:36px;height:36px;font-size:19px}
.step.sm .val{min-width:34px;height:36px;font-size:20px}
.rel{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.rel.under{color:var(--red)} .rel.par{color:var(--accent)} .rel.over{color:var(--muted)}
/* Drive arriba; abajo Putts a la izquierda y Penal. + Bunker contra el margen derecho */
.extras{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px 10px;align-items:end}
.extras .ex:first-child{grid-column:1/-1}
.extras .ex:nth-child(3){grid-column:3}
.extras .chip.bk{grid-column:4}
.ex{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.ex .seg button{min-width:42px}
.seg.na{position:relative;opacity:.55}
.seg.na button{visibility:hidden}
.seg.na::after{content:"Par 3";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.score-row .step{flex:none}
/* El alto de la fila lo marca el contador: el resultado y las etiquetas no empujan nada */
.rel-col{position:relative;align-self:stretch;min-width:0;flex:1}
.rel-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.badges .badge{white-space:nowrap}
.rel-col .rel{line-height:1.1}
.badges{display:flex;gap:6px}
.badges:empty{display:none}
.ex .label{font-size:11px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:0 10px;height:36px;font-weight:600;font-size:14px;min-width:38px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;height:36px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge{font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 6px;background:var(--accent-soft);color:var(--accent)}
.wolfbox{background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mapbox summary{font-weight:600;cursor:pointer}
.mapbox img{display:block;width:100%;border-radius:10px;margin-top:10px}
.prow{display:flex;gap:6px;align-items:center}
.prow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
.check.off{opacity:.55}
.closedbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:15px}
fieldset.ro{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:12px}
fieldset.ro:disabled .pcard{opacity:.8}
.badge.done{background:var(--sunk);color:var(--muted)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* tarjeta */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.card{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.card th,table.card td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.card th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.card td.h{font-family:var(--display);font-weight:600;font-size:17px}
table.card td.par{color:var(--muted);font-family:var(--display);font-size:16px}
table.card tr.sub td{background:var(--sunk);font-family:var(--display);font-weight:700;font-size:18px}
.sc{display:inline-grid;place-items:center;width:30px;height:30px;font-family:var(--display);font-weight:600;font-size:18px;margin:3px}
.sc.b{border:1.5px solid var(--red);border-radius:50%;color:var(--red)}
.sc.e{border:1.5px solid var(--gold);border-radius:50%;color:var(--gold);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--gold)}
.sc.bo{border:1.5px solid var(--muted)}
.sc.d{border:1.5px solid var(--ink);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);align-items:center}
.legend .sc{width:22px;height:22px;font-size:13px}

/* juegos */
.game{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.g-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-h h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.g-res{font-size:18px;font-weight:600;margin:0}
.g-res.lead{color:var(--accent)}
.g-lines{display:flex;flex-direction:column;gap:4px;font-size:14px}
.g-lines div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:4px}
.g-lines span:last-child{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
details.rule summary{font-size:13px;color:var(--muted);cursor:pointer}
details.rule p{font-size:14px;margin:6px 0 0;color:var(--muted)}
/* Gráficos: paleta de cada tema (jugadores --c1..--c8, parejas --ta y --tb, texto sobre las fichas --cin) */
:root{--c1:#2a78d6;--c2:#1aa37a;--c3:#e0a412;--c4:#e8693a;--c5:#8a5cd6;--c6:#d44a8a;--c7:#2bb0c4;--c8:#7d8b2e;--ta:var(--blue);--tb:var(--red);--cin:#fff}
:root.t-mulligan{--c1:#0b130e;--c2:#1b52cc;--c3:#dc2f1c;--c4:#0a7a3d;--c5:#b86200;--c6:#7b3fd1;--c7:#007f91;--c8:#7a6000;--ta:#0b130e;--tb:#dc2f1c;--cin:#fff}
:root.t-mulligan-dark{--c1:#d4ff3a;--c2:#7aa2ff;--c3:#ff6b55;--c4:#3ddc7e;--c5:#ffb547;--c6:#b98cff;--c7:#4fd6e6;--c8:#eef2ea;--ta:#d4ff3a;--tb:#ff6b55;--cin:#0b130e}
:root.t-sand{--c1:#0a6b7c;--c2:#c2452a;--c3:#2c5d9c;--c4:#8a6306;--c5:#467a2c;--c6:#8a4f9e;--c7:#a9581a;--c8:#46575c;--ta:#0a6b7c;--tb:#c2452a;--cin:#fff}
:root.t-sand-dark{--c1:#3fb7c6;--c2:#ff7a5c;--c3:#79a6f0;--c4:#e2b43a;--c5:#8fd16a;--c6:#c792ea;--c7:#ffad5c;--c8:#cfdcdb;--ta:#3fb7c6;--tb:#ff7a5c;--cin:#0d1a1e}
:root.t-orig{--c1:#1c6a44;--c2:#c13f29;--c3:#2b5fa8;--c4:#a97c08;--c5:#6b4fa0;--c6:#0f8c8c;--c7:#d9771f;--c8:#3d4a42;--ta:#1c6a44;--tb:#c13f29;--cin:#fff}
:root.t-orig-dark{--c1:#4cbc83;--c2:#ff7d64;--c3:#7fa9ec;--c4:#e2b43a;--c5:#b58cf0;--c6:#3fd0d0;--c7:#ffaa55;--c8:#e6ede8;--ta:#4cbc83;--tb:#ff7d64;--cin:#0e1411}
:root.t-apple{--c1:#007aff;--c2:#e0302a;--c3:#248a3d;--c4:#c25e00;--c5:#8944ab;--c6:#0071a4;--c7:#d30f45;--c8:#6e6e73;--ta:#007aff;--tb:#ff3b30;--cin:#fff}
:root.t-apple-dark{--c1:#0a84ff;--c2:#ff453a;--c3:#30d158;--c4:#ff9f0a;--c5:#bf5af2;--c6:#64d2ff;--c7:#ff375f;--c8:#98989d;--ta:#0a84ff;--tb:#ff453a;--cin:#000}
:root.t-anthropic{--c1:#c6613f;--c2:#3b64a0;--c3:#4f6a3a;--c4:#9a6c00;--c5:#6a4c93;--c6:#2f7f86;--c7:#8f8a7a;--c8:#141413;--ta:#c6613f;--tb:#3b64a0;--cin:#fff}
:root.t-anthropic-green{--c1:#4f6a3a;--c2:#c6613f;--c3:#3b64a0;--c4:#9a6c00;--c5:#6a4c93;--c6:#2f7f86;--c7:#8f8a7a;--c8:#141413;--ta:#4f6a3a;--tb:#c6613f;--cin:#fff}
:root.t-anthropic-dark{--c1:#d97757;--c2:#7fa2d9;--c3:#8fae6f;--c4:#d4a440;--c5:#a58bd1;--c6:#5fb3ba;--c7:#c9c5b8;--c8:#f0eee6;--ta:#d97757;--tb:#7fa2d9;--cin:#1f1e1d}
:root.t-anthropic-green-dark{--c1:#8fae6f;--c2:#d97757;--c3:#7fa2d9;--c4:#d4a440;--c5:#a58bd1;--c6:#5fb3ba;--c7:#c9c5b8;--c8:#f0eee6;--ta:#8fae6f;--tb:#d97757;--cin:#1f1e1d}
:root.t-royal{--c1:#12432f;--c2:#8c2a1c;--c3:#1f3a6a;--c4:#a07a22;--c5:#5b3a6e;--c6:#2f6b5e;--c7:#8a6a3a;--c8:#1b2a21;--ta:#12432f;--tb:#8c2a1c;--cin:#f6e9c4}
:root.t-lux{--c1:#0f3d2b;--c2:#6e1c22;--c3:#1f3a6a;--c4:#9a7420;--c5:#5b3a6e;--c6:#2f6b5e;--c7:#8a6a3a;--c8:#1a271f;--ta:#0f3d2b;--tb:#6e1c22;--cin:#f6e9c4}
.chartwrap{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.chartwrap:empty{display:none}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body,inherit);font-variant-numeric:tabular-nums}
.chart text.in{fill:var(--cin);font-weight:700;font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .sep{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
.chart .zero{fill:var(--muted);opacity:.5}
.chart .empty{fill:var(--sunk)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend svg{margin-right:4px;vertical-align:middle}
.g-lines div.best span{color:var(--accent);font-weight:600}

/* stats */
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .big{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .sub{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.dist{display:flex;height:28px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.dist span{display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;min-width:0}

/* vueltas y setup */
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ritem.cur{border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:120px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2>*{min-width:0}
.modeseg{width:100%}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.receipt.fresh{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rc-big{display:flex;align-items:flex-end;gap:10px}
.rc-big b{font-family:var(--display);font-weight:700;font-size:64px;line-height:.85;font-variant-numeric:tabular-nums}
.rc-big span{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;display:flex;flex-direction:column;gap:4px}
.rc-big small{font-family:var(--body);font-weight:600;font-size:13px;color:var(--muted)}
.rc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{background:var(--sunk);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.kpi b.hi{color:var(--accent)}
.kpi span{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.pill.soft{background:var(--accent-soft);color:var(--ink)}
.mg .receipt{border-radius:20px}
.mg .rc-big b{font-size:72px}
.mg .rc-big b{background:linear-gradient(transparent 55%,var(--volt) 55% 85%,transparent 85%);padding:0 4px;margin-left:-4px}
:root.t-mulligan-dark .rc-big b{background:linear-gradient(transparent 55%,rgba(212,255,58,.32) 55% 85%,transparent 85%)}
.mg .kpi b.hi{color:var(--ink);background:var(--volt);color:var(--on-volt);border-radius:6px;padding:0 6px}
.mg .pill{background:var(--blk);color:var(--on-blk)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative;padding:0}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .sw{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.mg .icon-btn{border:1.5px solid var(--ink)}
.mg .icon-btn .sw{background:var(--volt)}
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet-p{position:relative;width:100%;max-width:640px;margin:0 auto;background:var(--bg);color:var(--ink);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet-p .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.skin[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.skin .prev{height:76px;border-radius:10px;padding:9px;display:flex;flex-direction:column;justify-content:flex-end}
.skin .pb{border-radius:8px;padding:7px 9px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.skin .pb b{font-size:22px;font-weight:700;line-height:.9}
.skin .pb i{display:block;height:5px;border-radius:3px;width:70%}
.skin .nm{font-weight:700;font-size:14px;padding:0 4px}
.skin .ds{font-size:12px;color:var(--muted);padding:0 4px 2px;line-height:1.3}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.ghead{grid-column:1/-1;margin:8px 0 -2px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.checks .ghead:first-child{margin-top:0}
.modeseg button{flex:1;height:40px;font-size:15px}
.check span{flex:1;min-width:0}
.qbtn{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;color:var(--muted);font-weight:700;font-size:14px;line-height:1;padding:0}
.qbtn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ruletip{grid-column:1/-1;margin:-2px 0 2px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
.teedot{display:inline-block;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);vertical-align:-1px;flex:none}
.teebtn{flex:none;width:40px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;padding:0}
.teebtn .teedot{width:20px;height:20px;border-width:2px}
/* Editor de cancha: grilla de 18 hoyos */
table.cedit{table-layout:fixed}
table.cedit td{padding:3px 2px}
table.cedit th:first-child{width:38px}
table.cedit input{width:100%;min-width:0;min-height:40px;padding:6px 2px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-variant-numeric:tabular-nums}
table.cedit input.own{border-color:var(--accent)}
.chip .teedot{margin-right:4px}
.rel .note{font-family:var(--body);font-weight:400;font-size:13px;text-transform:none;letter-spacing:0}
.p-tee{display:flex;align-items:center;gap:5px;margin-top:5px;font-family:var(--body);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* iOS Safari le da a la fecha su propio alto y un ancho mínimo: la igualamos a los selects */
.field input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;line-height:1.25;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.25em}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--red);font-size:13px}

/* estilo iOS para los temas Apple */
.ios header.top{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.ios body::before{background:var(--bar)}
.ios .brand{text-transform:none;font-weight:700;font-size:28px;letter-spacing:-.02em}
.ios nav.tabs{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
.ios .tab{text-transform:none;letter-spacing:0;font-size:11px;font-weight:500;border-top:0;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8e8e93}
.ico .tab::before{content:"";width:26px;height:26px;background:currentColor;-webkit-mask:var(--ico) center/contain no-repeat;mask:var(--ico) center/contain no-repeat}
.ios .tab[aria-current="page"]{color:var(--accent)}
.ico .tab[data-v="hole"]{--ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 21V3'/><path d='M6 4h11l-2.5 4L17 12H6'/></svg>")}
.ico .tab[data-v="card"]{--ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='16' rx='3'/><path d='M3 10h18M9 4v16M15 4v16'/></svg>")}
.ico .tab[data-v="games"]{--ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 4h8v5a4 4 0 0 1-8 0z'/><path d='M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8'/></svg>")}
.ico .tab[data-v="stats"]{--ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 20v-8M12 20V5M19 20v-5'/></svg>")}
.ico .tab[data-v="rounds"]{--ico:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6h11M9 12h11M9 18h11'/><circle cx='4.5' cy='6' r='1'/><circle cx='4.5' cy='12' r='1'/><circle cx='4.5' cy='18' r='1'/></svg>")}

.ios .label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:400;color:var(--muted)}
.ios .hole-no{font-weight:700;letter-spacing:-.03em}
.ios .hole-no small{font-weight:600}
.ios h2,.ios .g-h h3{font-weight:700;letter-spacing:-.01em}
.ios .pcard,.ios .game,.ios .tile,.ios .ritem,.ios .tablewrap,.ios .mapbox,.ios .wolfbox,.ios .closedbar{border:0;border-radius:12px}
.ios .wolfbox{background:var(--surface)}
.ios .strip button{border:0;background:var(--surface);border-radius:10px}
.ios .strip button.done{background:var(--accent-soft)}
.ios .strip button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.ios .step{border:0;background:var(--sunk);border-radius:9px;padding:2px}
.ios .step button{background:transparent;color:var(--accent)}
.ios .step .val{background:var(--surface);border-radius:7px;color:var(--ink)}
.ios .seg{border:0;background:var(--sunk);border-radius:9px;padding:2px}
.ios .seg button,.ios .seg button + button{background:transparent;border:0;border-radius:7px}
.ios .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.ios.t-apple-dark .seg button[aria-pressed="true"]{background:#636366;color:#fff}
.ios .chip{border:0;background:var(--sunk)}
.ios .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ios .btn{border:0;background:var(--sunk);border-radius:12px;color:var(--accent)}
.ios .btn.primary{background:var(--accent);color:var(--accent-ink)}
.ios .btn.danger{background:var(--sunk);color:var(--red)}
.ios .rel{text-transform:none;letter-spacing:0;font-size:17px}
.ios table.card th{text-transform:none;letter-spacing:0;font-size:13px}
.ios .themesel,.ios .field input,.ios .field select,.ios .prow input,.ios .check{border:0}
.ios .themesel{background:var(--sunk)}
.ios .field input,.ios .field select,.ios .prow input,.ios .check{background:var(--surface)}
.ios .badge{border-radius:999px}

/* tema Royal: club tradicional */
:root.royal{--leaf:#e3d3a6; --cream:#f6e9c4}
.royal body{background-color:var(--bg);background-image:repeating-linear-gradient(0deg,rgba(110,80,20,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(110,80,20,.025) 0 1px,transparent 1px 4px)}
.royal header.top{background:var(--forest);border-bottom:1px solid var(--brass);box-shadow:0 3px 0 -1px var(--forest),0 4px 0 -1px var(--brass)}
.royal body::before{background:var(--forest)}
.royal .brand{display:flex;align-items:center;gap:10px;color:var(--cream);font-family:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;font-style:normal;text-transform:none;letter-spacing:0;font-size:36px;font-weight:400;line-height:1}
.royal .brand::before{content:"";width:22px;height:25px;flex:none;background:#d9b65c;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'><path d='M16 1.5 29 5v11.5c0 8.6-5.6 14.6-13 18-7.4-3.4-13-9.4-13-18V5z' fill='none' stroke='black' stroke-width='2'/><path d='M13 27V10' stroke='black' stroke-width='2' stroke-linecap='round'/><path d='M13 10.5h9l-2.2 3.2L22 17h-9' fill='black'/><path d='M9 27.5h10' stroke='black' stroke-width='2' stroke-linecap='round'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 36'><path d='M16 1.5 29 5v11.5c0 8.6-5.6 14.6-13 18-7.4-3.4-13-9.4-13-18V5z' fill='none' stroke='black' stroke-width='2'/><path d='M13 27V10' stroke='black' stroke-width='2' stroke-linecap='round'/><path d='M13 10.5h9l-2.2 3.2L22 17h-9' fill='black'/><path d='M9 27.5h10' stroke='black' stroke-width='2' stroke-linecap='round'/></svg>") center/contain no-repeat}
.royal .brand b{display:none}
.royal body,.royal button,.royal input,.royal select{font-variant-numeric:lining-nums tabular-nums}
.royal .top-in{gap:8px}
.royal .brand{font-size:33px}
.royal .round-meta{color:#d8cca6;font-size:14px;font-style:italic}
.royal .themesel{max-width:116px;background:transparent;color:var(--cream);border:1px solid rgba(217,182,92,.7);border-radius:2px;font-family:var(--body);font-size:16px}
.royal .themesel option{color:#1b2a21;background:#fbf6e8}
.royal nav.tabs{background:var(--forest);border-top:1px solid var(--brass);box-shadow:0 -3px 0 -1px var(--forest),0 -4px 0 -1px var(--brass)}
.royal .tab{color:#bfb289;font-family:var(--body);text-transform:lowercase;font-variant:small-caps;letter-spacing:.12em;font-size:18px;font-weight:500;border-top:0;position:relative}
.royal .tab[aria-current="page"]{color:#f1d88e}
.royal .tab[aria-current="page"]::after{content:"";position:absolute;left:50%;top:5px;width:6px;height:6px;background:#d9b65c;transform:translateX(-50%) rotate(45deg)}
.royal .label{font-family:var(--body);text-transform:lowercase;font-variant:small-caps;letter-spacing:.14em;font-size:15px;font-weight:500;color:#6d6248}
.royal .hole-no{font-style:italic;font-weight:700}
.royal .hole-no small{font-style:italic;font-weight:600;color:#6d6248}
.royal .fact .num{font-family:var(--display);font-weight:600}
.royal .pcard,.royal .game,.royal .tile,.royal .ritem,.royal .tablewrap,.royal .wolfbox,.royal .mapbox{background:var(--surface);border:1px solid var(--brass);border-radius:2px;box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px var(--leaf),0 1px 0 rgba(90,70,20,.08)}
.royal .pcard,.royal .game,.royal .wolfbox{padding:16px}
.royal .closedbar{background:var(--accent-soft);border:1px solid var(--brass);border-radius:2px;font-style:italic}
.royal .strip{gap:5px}
.royal .strip button{background:var(--surface);border:1px solid var(--leaf);border-radius:2px;font-family:var(--display);font-weight:600;color:var(--ink)}
.royal .strip button.done{background:#e6ead9;border-color:#b9c2a3;color:var(--accent)}
.royal .strip button[aria-current="true"]{background:var(--forest);color:var(--cream);border-color:var(--forest);box-shadow:inset 0 0 0 2px var(--forest),inset 0 0 0 3px #d9b65c}
.royal .step,.royal .seg{border:1px solid var(--brass);border-radius:2px;background:var(--surface)}
.royal .step button{background:transparent;color:var(--accent);font-family:var(--display);font-weight:600}
.royal .step .val{background:transparent;border-left:1px solid var(--leaf);border-right:1px solid var(--leaf);font-family:var(--display);color:var(--ink)}
.royal .seg button{font-family:var(--body);font-size:16px;color:var(--accent)}
.royal .seg button + button{border-left:1px solid var(--leaf)}
.royal .seg button[aria-pressed="true"]{background:var(--forest);color:var(--cream)}
.royal .chip{border:1px solid var(--brass);border-radius:2px;background:var(--surface);font-family:var(--body);font-size:17px;color:var(--accent)}
.royal .chip[aria-pressed="true"]{background:var(--forest);color:var(--cream);border-color:var(--forest)}
.royal .btn{border:1px solid var(--brass);border-radius:2px;background:var(--surface);color:var(--accent);font-family:var(--body);font-size:17px;font-variant:small-caps;text-transform:lowercase;letter-spacing:.08em}
.royal .btn.primary{background:var(--forest);color:var(--cream);border-color:var(--forest);box-shadow:inset 0 0 0 2px var(--forest),inset 0 0 0 3px #d9b65c}
.royal .btn.danger{color:var(--red);border-color:var(--red)}
.royal .rel{font-family:var(--body);text-transform:lowercase;font-variant:small-caps;letter-spacing:.1em;font-size:20px;font-style:italic}
.royal .p-name{font-family:var(--display);font-size:20px;font-weight:600}
.royal .p-tot{font-style:italic;font-size:15px}
.royal h2,.royal .g-h h3{font-style:italic;font-weight:600}
.royal .g-h h3::after{content:"";display:block;width:34px;height:0;border-top:1px solid var(--brass);border-bottom:1px solid var(--brass);padding-top:2px;margin-top:7px}
.royal .g-res{font-family:var(--display);font-weight:600}
.royal .g-lines div{border-top-color:var(--leaf)}
.royal details.rule summary{font-style:italic}
.royal .badge{background:transparent;border:1px solid var(--brass);color:var(--accent);border-radius:2px;font-family:var(--body);font-variant:small-caps;text-transform:lowercase;letter-spacing:.1em;font-size:14px}
.royal .badge.done{color:#6d6248}
.royal table.card th{font-family:var(--body);text-transform:lowercase;font-variant:small-caps;letter-spacing:.12em;font-size:15px;color:#6d6248}
.royal table.card td{border-bottom-color:var(--leaf)}
.royal table.card td.h{font-family:var(--display);font-style:italic}
.royal table.card tr.sub td{background:var(--forest);color:var(--cream);font-family:var(--display);border-bottom-color:var(--forest)}
.royal .sc{font-family:var(--display);font-weight:600}
.royal .tile .big{font-family:var(--display);font-weight:600}
.royal .field input,.royal .field select,.royal .prow input,.royal .check{border-radius:2px;border-color:var(--brass);font-family:var(--body);font-size:17px}
.royal .ex .label{font-size:14px}

/* tema Real Club: Royal con ornamentos */
.lux body{background-color:var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44'><g fill='none' stroke='%23b08a35' stroke-opacity='.16' stroke-width='.8'><path d='M22 0 44 22 22 44 0 22z'/></g><g fill='%23b08a35' fill-opacity='.2'><circle cx='22' cy='22' r='1.7'/><path d='M22 7c1.7 2.2 1.7 4.4 0 6.6-1.7-2.2-1.7-4.4 0-6.6zM22 30.4c1.7 2.2 1.7 4.4 0 6.6-1.7-2.2-1.7-4.4 0-6.6zM7 22c2.2-1.7 4.4-1.7 6.6 0-2.2 1.7-4.4 1.7-6.6 0zM30.4 22c2.2-1.7 4.4-1.7 6.6 0-2.2 1.7-4.4 1.7-6.6 0z'/><circle cx='0' cy='0' r='1.2'/><circle cx='44' cy='0' r='1.2'/><circle cx='0' cy='44' r='1.2'/><circle cx='44' cy='44' r='1.2'/></g></svg>")}
.lux header.top,.lux nav.tabs,.lux body::before{background-color:var(--forest);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><g fill='none' stroke='%23d9b65c' stroke-opacity='.13' stroke-width='.8'><path d='M18 0 36 18 18 36 0 18z'/></g><g fill='%23d9b65c' fill-opacity='.16'><circle cx='18' cy='18' r='1.4'/><circle cx='0' cy='0' r='1'/><circle cx='36' cy='0' r='1'/><circle cx='0' cy='36' r='1'/><circle cx='36' cy='36' r='1'/></g></svg>")}
.lux .brand{font-size:31px}

<script>
// Canchas: la Cancha Nueva viene de fábrica y las demás las carga cada uno (viajan dentro de las vueltas que se comparten).
// Par e índice son de la cancha; una salida puede tener los suyos (la de damas). Distancias en la unidad de la cancha.
// Mismo orden de campos que devuelve cleanCourse, así se puede comparar como texto.
const BUILTIN={id:"mdp-nueva",name:"Cancha Nueva",club:"Mar del Plata Golf Club",unit:"m",
  par:[5,4,3,4,4,5,4,3,4,4,4,3,4,4,5,3,4,4],
  si:[5,9,17,3,13,1,7,15,11,14,12,18,2,8,6,16,4,10],
  tees:{
   azul:{name:"Azul",color:"#2563eb",m:[494,390,160,417,372,536,400,198,377,398,394,157,407,373,"465/500",168,420,398]},
   blanca:{name:"Blanca",color:"#ffffff",m:[484,380,160,390,350,530,392,192,336,398,394,138,397,373,456,157,420,398]},
   roja:{name:"Roja",color:"#dc2626",m:[477,327,120,362,315,475,366,147,281,364,350,130,339,337,430,139,383,336],par:[5,4,3,5,4,5,4,3,4,4,4,3,4,4,5,3,5,4]}},
  def:"blanca"};
const MAXT=6;
// Colores de salida para el editor, con el nombre que se sugiere
const TPAL=[["Blanca","#ffffff"],["Azul","#2563eb"],["Roja","#dc2626"],["Amarilla","#facc15"],["Negra","#111111"],["Dorada","#c9a227"],["Verde","#16a34a"],["Naranja","#f97316"],["Plateada","#9ca3af"]];
const has=(o,k)=>!!o&&Object.prototype.hasOwnProperty.call(o,k);
const clone=o=>JSON.parse(JSON.stringify(o));
const courses=()=>S&&S.courses&&S.courses.length?S.courses:[BUILTIN];
// La de una vuelta que llegó por link todavía no está guardada: se busca también en ui.inCourse
const courseById=id=>courses().find(c=>c.id===id)||(ui.inCourse&&ui.inCourse.id===id?ui.inCourse:null);
// Cancha de la vuelta (las vueltas de antes de las canchas son de la Cancha Nueva)
const CRS=r=>{const id=(r&&r.course)||BUILTIN.id;return courseById(id)||(id===BUILTIN.id?BUILTIN:courses()[0])};
const defTee=c=>has(c.tees,c.def)?c.def:Object.keys(c.tees)[0];
const teeK=(r,p)=>{const c=CRS(r),k=(r&&r.tees&&r.tees[p])||(r&&r.tee);return has(c.tees,k)?k:defTee(c)};
const tPar=(c,k)=>c.tees[k]&&c.tees[k].par||c.par;
const tSi=(c,k)=>c.tees[k]&&c.tees[k].si||c.si;
const PP=(r,p)=>tPar(CRS(r),teeK(r,p));
const TEEP=(r,p)=>CRS(r).tees[teeK(r,p)];
const teeSet=r=>[...new Set(r.players.map((_,p)=>teeK(r,p)))];
// Par de la cancha para mostrar: el de todos si coincide; si no, el general
const P=r=>{const t=teeSet(r);return t.length===1?tPar(CRS(r),t[0]):CRS(r).par};
const teeNames=r=>{const c=CRS(r),t=teeSet(r).map(k=>esc(c.tees[k].name));return t.length===1?"Salida "+t[0]:"Salidas "+t.slice(0,-1).join(", ")+" y "+t[t.length-1]};
// En el hoyo: "4" o "4/5" si los jugadores tienen distinto par (lo mismo con el índice)
const parLab=(r,h)=>[...new Set(r.players.map((_,p)=>PP(r,p)[h]))].sort().join("/");
const siLab=(r,h)=>{const c=CRS(r);return[...new Set(teeSet(r).map(k=>tSi(c,k)[h]))].sort((a,b)=>a-b).map(x=>x==null?"–":x).join("/")};
const dotC=col=>`<i class="teedot" style="background:${col}" aria-hidden="true"></i>`;
const teeDot=(c,k)=>dotC(c.tees[k]?c.tees[k].color:"#888888");
const yd=v=>String(v).split("/").map(x=>Math.round(+x*1.09361)).join("/");
// Distancia del hoyo en yardas (la app muestra todo en yardas)
const dist=(c,k,h)=>{const v=c.tees[k]&&c.tees[k].m[h];return v==null?"–":c.unit==="yd"?String(v):yd(v)};
// Con dos distancias ("465/500") el total de la tarjeta usa la segunda
const totYd=(c,k)=>{const t=c.tees[k].m.reduce((a,v)=>a+(parseInt(String(v).split("/").pop())||0),0);return c.unit==="yd"?t:Math.round(t*1.09361)};
const sum18=a=>a.reduce((s,x)=>s+(+x||0),0);
// Lo que viene de afuera (link, copia, editor) se rearma con valores válidos
const intIn=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b?x:null;

function blankData(n){return Array.from({length:18},()=>Array.from({length:n},()=>({s:null,p:null,fw:null,pen:0,bk:false})))}
function allGames(){const g={};GAMES.forEach(x=>g[x[0]]=true);return g}
function newRound(o){return{id:"r"+Date.now()+Math.floor(Math.random()*1000),date:o.date,players:o.players,teams:o.teams,start:o.start,n:o.n,games:o.games,d:blankData(o.players.length),wolf:{},cur:0}}

/* ---------- helpers ---------- */
const ids=r=>r.players.map((_,i)=>i);
const hs=r=>Array.from({length:r.n},(_,i)=>r.start+i);
const sc=(r,h,p)=>r.d[h][p].s;
const comp=(r,h)=>r.d[h].every(x=>x.s!=null);
const nm=(r,i)=>r.players[i];
const tn=(r,t)=>t.map(i=>r.players[i]).join("/");
const best=(r,h,t)=>Math.min(...t.map(p=>sc(r,h,p)));
const sum=(r,h,t)=>t.reduce((a,p)=>a+sc(r,h,p),0);
function lowWinner(r,h){const s=r.d[h].map(x=>x.s),m=Math.min(...s);return s.filter(x=>x===m).length===1?s.indexOf(m):-1}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toPar(n){return n===0?"E":(n>0?"+":"")+n}
function relName(d){return d<=-3?"Albatros":d===-2?"Águila":d===-1?"Birdie":d===0?"Par":d===1?"Bogey":d===2?"Doble":d===3?"Triple":d===4?"Cuádruple":"+"+d}

function matchPlay(r,list,fa,fb,na,nb){
  let st=0,pl=0,closed=null;
  for(let i=0;i<list.length;i++){const h=list[i];if(!comp(r,h))break;const a=fa(h),b=fb(h);
    if(a<b)st++;else if(b<a)st--;pl++;const left=list.length-pl;
    if(!closed&&Math.abs(st)>left)closed={st,left}}
  const rem=list.length-pl,fin=closed||(rem===0?{st,left:0}:null);let txt,winner=null;
  if(fin){winner=fin.st>0?0:fin.st<0?1:-1;
    txt=fin.st===0?"All square":fin.left>0?`${fin.st>0?na:nb} gana ${Math.abs(fin.st)} & ${fin.left}`:`${fin.st>0?na:nb} gana ${Math.abs(fin.st)} arriba`}
  else if(pl===0)txt="Sin hoyos completos";
  else{txt=(st===0?"All square":`${st>0?na:nb} ${Math.abs(st)} arriba`)+` · quedan ${rem}`+(st!==0&&Math.abs(st)===rem?" (dormie)":"")}
  return{st,pl,txt,winner,done:!!fin}}

/* ---------- juegos ---------- */
function gMedal(r){const t=ids(r).map(p=>{let s=0,par=0,n=0;hs(r).forEach(h=>{const v=sc(r,h,p);if(v!=null){s+=v;par+=PP(r,p)[h];n++}});return{p,s,tp:s-par,n}});
  const played=t.filter(x=>x.n>0).sort((a,b)=>a.tp-b.tp||a.s-b.s);
  if(!played.length)return{res:"Sin scores todavía",lines:[]};
  const lead=played.filter(x=>x.tp===played[0].tp).map(x=>nm(r,x.p)).join(" y ");
  return{res:`Lidera ${lead} (${toPar(played[0].tp)})`,lines:played.map(x=>[nm(r,x.p),`${x.s} (${toPar(x.tp)}) · ${x.n} h`])}}
function gFourball(r){const[A,B]=r.teams;const m=matchPlay(r,hs(r),h=>best(r,h,A),h=>best(r,h,B),tn(r,A),tn(r,B));return{res:m.txt,lines:[]}}
function gNassau(r){const[A,B]=r.teams,L=hs(r),fa=h=>best(r,h,A),fb=h=>best(r,h,B),na=tn(r,A),nb=tn(r,B);
  const parts=r.n===18?[["Ida",L.slice(0,9)],["Vuelta",L.slice(9)],["Total",L]]:[["Total",L]];
  const pts=[0,0];const lines=parts.map(([lab,l])=>{const m=matchPlay(r,l,fa,fb,na,nb);if(m.done){if(m.winner===0)pts[0]++;else if(m.winner===1)pts[1]++;else{pts[0]+=.5;pts[1]+=.5}}return[lab,m.txt]});
  return{res:`${na} ${fmtPt(pts[0])} – ${fmtPt(pts[1])} ${nb}`,lines}}
function fmtPt(x){return Number.isInteger(x)?String(x):x.toFixed(1).replace(".",",")}
function gSkins(r){let carry=0;const won=r.players.map(()=>0);let last=null;
  for(const h of hs(r)){if(!comp(r,h))break;carry++;const w=lowWinner(r,h);if(w>=0){won[w]+=carry;carry=0}last=h}
  const order=ids(r).sort((a,b)=>won[b]-won[a]);
  const lines=order.map(p=>[nm(r,p),won[p]+" skin"+(won[p]===1?"":"s")]);
  if(carry)lines.push([last===hs(r)[r.n-1]?"Sin dueño":"Acumulado en juego",carry]);
  const top=won[order[0]];return{res:top?`Lidera ${order.filter(p=>won[p]===top).map(p=>nm(r,p)).join(" y ")} con ${top}`:"Sin skins ganados todavía",lines}}
function gSixes(r){const[a,b,c,d]=[0,1,2,3],seg=r.n/3,L=hs(r);
  const pairs=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];const pts=[0,0,0,0];
  const lines=pairs.map(([A,B],i)=>{const l=L.slice(i*seg,(i+1)*seg);const m=matchPlay(r,l,h=>best(r,h,A),h=>best(r,h,B),tn(r,A),tn(r,B));
    if(m.done){if(m.winner===0)A.forEach(p=>pts[p]++);else if(m.winner===1)B.forEach(p=>pts[p]++);else[...A,...B].forEach(p=>pts[p]+=.5)}
    return[`H${l[0]+1}–${l[l.length-1]+1}: ${tn(r,A)} vs ${tn(r,B)}`,m.txt]});
  const top=Math.max(...pts);const leaders=ids(r).filter(p=>pts[p]===top);
  lines.push(["Tramos ganados",ids(r).map(p=>`${nm(r,p)} ${fmtPt(pts[p])}`).join(" · ")]);
  return{res:top?`${leaders.length>1?"Empate":"Gana"} ${leaders.map(p=>nm(r,p)).join(", ")} (${fmtPt(top)})`:"Sin tramos terminados",lines}}
function vnum(x,y,flip){const lo=Math.min(x,y),hi=Math.max(x,y);return(hi>=10||flip)?hi*10+lo:lo*10+hi}
function gVegas(r){const[A,B]=r.teams;let pts=0,n=0;
  for(const h of hs(r)){if(!comp(r,h))break;
    const bA=A.some(p=>sc(r,h,p)<PP(r,p)[h]),bB=B.some(p=>sc(r,h,p)<PP(r,p)[h]);
    const vA=vnum(sc(r,h,A[0]),sc(r,h,A[1]),bB&&!bA),vB=vnum(sc(r,h,B[0]),sc(r,h,B[1]),bA&&!bB);pts+=vB-vA;n++}
  if(!n)return{res:"Sin hoyos completos",lines:[]};
  return{res:pts===0?"Empatados":`${pts>0?tn(r,A):tn(r,B)} +${Math.abs(pts)}`,lines:[["Hoyos jugados",n]]}}
function gWolf(r){const pts=[0,0,0,0],L=hs(r);let missing=0;
  L.forEach((h,k)=>{if(!comp(r,h))return;const w=k%4,dec=r.wolf[h];if(dec==null){missing++;return}
    const others=ids(r).filter(p=>p!==w);
    if(typeof dec==="number"){const A=[w,dec],B=others.filter(p=>p!==dec);const a=best(r,h,A),b=best(r,h,B);
      if(a<b)A.forEach(p=>pts[p]++);else if(b<a)B.forEach(p=>pts[p]++)}
    else{const a=sc(r,h,w),b=best(r,h,others);if(a<b)pts[w]+=dec==="blind"?6:4;else if(b<a)others.forEach(p=>pts[p]++)}});
  const order=ids(r).sort((x,y)=>pts[y]-pts[x]);const lines=order.map(p=>[nm(r,p),pts[p]+" pts"]);
  if(missing)lines.push(["Hoyos sin decisión del lobo",missing]);
  const top=pts[order[0]];return{res:top?`Lidera ${order.filter(p=>pts[p]===top).map(p=>nm(r,p)).join(" y ")} con ${top}`:missing?"Cargá quién eligió el lobo en cada hoyo":"Sin puntos todavía",lines}}
function gRabbit(r){const L=hs(r),halves=r.n===18?[["Ida",L.slice(0,9)],["Vuelta",L.slice(9)]]:[[r.start===0?"Ida":"Vuelta",L]];
  const lines=halves.map(([lab,l])=>{let holder=null,fin=true;for(const h of l){if(!comp(r,h)){fin=false;break}const w=lowWinner(r,h);if(w>=0)holder=w}
    return[lab+(fin?"":" (en juego)"),holder==null?"Nadie":nm(r,holder)]});
  return{res:lines.map(x=>`${x[0].split(" ")[0]}: ${x[1]}`).join(" · "),lines:[]}}
function gSnake(r){let holder=null,any=false;const tp=r.players.map(()=>0);
  for(const h of hs(r)){const ps=r.d[h].map(x=>x.p);if(ps.every(x=>x==null))continue;any=true;
    let mx=0,who=null;ps.forEach((v,p)=>{if(v!=null&&v>=3){tp[p]++;if(v>=mx){mx=v;who=p}}});if(who!=null)holder=who}
  if(!any)return{res:"Cargá los putts para jugar Snake",lines:[]};
  return{res:holder==null?"Nadie tiene la víbora":`La víbora la tiene ${nm(r,holder)}`,lines:ids(r).map(p=>[nm(r,p),tp[p]+" tres putts"])}}
function gBBA(r){const[A,B]=r.teams;let a=0,b=0,n=0;
  for(const h of hs(r)){if(!comp(r,h))break;const x=best(r,h,A),y=best(r,h,B);if(x<y)a++;else if(y<x)b++;
    const s=sum(r,h,A),t=sum(r,h,B);if(s<t)a++;else if(t<s)b++;n++}
  if(!n)return{res:"Sin hoyos completos",lines:[]};
  return{res:`${tn(r,A)} ${a} – ${b} ${tn(r,B)}`,lines:[]}}
function stbl(s,par){return Math.max(0,2-(s-par))}
function gStableford(r){const t=ids(r).map(p=>{let s=0;hs(r).forEach(h=>{const v=sc(r,h,p);if(v!=null)s+=stbl(v,PP(r,p)[h])});return{p,s}}).sort((a,b)=>b.s-a.s);
  return{res:t[0].s?`Lidera ${t.filter(x=>x.s===t[0].s).map(x=>nm(r,x.p)).join(" y ")} con ${t[0].s}`:"Sin puntos todavía",lines:t.map(x=>[nm(r,x.p),x.s+" pts"])}}
// Si el juego se puede jugar con n jugadores y equipos de a y b; si no, el motivo
function gameOk(k,n,a,b,holes){
  if(k==="wolf")return n===4?"":"necesita 4 jugadores";
  if(k==="sixes")return n!==4?"necesita 4 jugadores":holes&&holes!==18?"necesita 18 hoyos":"";
  if(k==="nines")return n===3?"":"necesita 3 jugadores";
  if(k==="vegas")return a===2&&b===2?"":"necesita 2 parejas";
  if(k==="acey")return n>=3?"":"necesita 3 o más";
  // Four-ball es de parejas (1 contra 1 es Match play individual); Nassau también se juega mano a mano
  if(k==="fourball")return a>=2&&a===b?"":"necesita 2 parejas o equipos iguales";
  if(k==="nassau")return holes&&holes!==18?"necesita 18 hoyos":a&&b?(a===b?"":"necesita equipos del mismo tamaño"):"necesita 2 equipos";
  // Suman o comparan los dos scores de cada equipo: hacen falta parejas (o equipos iguales más grandes)
  if(k==="bba"||k==="lowhigh"||k==="scotch")return a>=2&&a===b?"":"necesita 2 parejas o equipos iguales";
  return n>=2?"":"necesita 2 o más"}
const okR=(k,r)=>!gameOk(k,r.players.length,r.teams[0].length,r.teams[1].length,r.n);
/* ---------- juegos nuevos ---------- */
// Puntos por hoyo para cada jugador: f(r,h,st) devuelve un número por jugador (null = ese hoyo no cuenta); st guarda estado entre hoyos
const gir=(x,par)=>x.s!=null&&x.p!=null&&x.s-x.p<=par-2;
const PH={
 stab2:{f:(r,h)=>{const v=r.players.map((_,p)=>{const s=sc(r,h,p);if(s==null)return null;const d=s-PP(r,p)[h];return d<=-3?8:d===-2?5:d===-1?2:d===0?0:d===1?-1:-3});return v.some(x=>x!=null)?v:null}},
 nines:{f:(r,h)=>{if(!comp(r,h))return null;const s=r.d[h].map(x=>x.s),o=[...s].sort((a,b)=>a-b);
   if(o[0]===o[2])return[3,3,3];if(o[0]===o[1])return s.map(v=>v===o[0]?4:1);if(o[1]===o[2])return s.map(v=>v===o[0]?5:2);return s.map(v=>v===o[0]?5:v===o[1]?3:1)}},
 acey:{f:(r,h)=>{if(!comp(r,h))return null;const s=r.d[h].map(x=>x.s),n=s.length,uniq=m=>s.filter(v=>v===m).length===1?s.indexOf(m):-1,lo=uniq(Math.min(...s)),hi=uniq(Math.max(...s));
   return s.map((_,p)=>(p===lo?n-1:lo>=0?-1:0)+(p===hi?1-n:hi>=0?1:0))}},
 chairman:{f:(r,h,st)=>{if(!comp(r,h))return null;const w=lowWinner(r,h),v=r.players.map(()=>0);if(w>=0){if(st.chair===w)v[w]=1;st.chair=w}return v}},
 fidget:{f:(r,h)=>{if(!comp(r,h))return null;const w=lowWinner(r,h);return r.players.map((_,p)=>p===w?1:0)}},
 garbage:{f:(r,h)=>{const v=r.players.map((_,p)=>{const x=r.d[h][p],par=PP(r,p)[h];if(x.s==null)return null;const d=x.s-par;let n=d<=-3?3:d===-2?2:d===-1?1:0;
   if(x.bk&&x.s<=par)n++;if(par>=4&&x.s<=par&&x.fw){if(x.fw==="c"){if(gir(x,par))n++}else n++}if(x.p===0)n++;if(r.grn&&r.grn[h]===p&&x.s<=par)n++;return n});return v.some(x=>x!=null)?v:null}},
 greenies:{f:(r,h)=>{const g=r.grn&&r.grn[h];if(P(r)[h]!==3||g==null)return null;return r.players.map((_,p)=>p===g&&sc(r,h,p)!=null&&sc(r,h,p)<=PP(r,p)[h]?1:0)}},
 bbb:{f:(r,h)=>{const b=r.bbb&&r.bbb[h];if(!b||b.every(x=>x==null))return null;return r.players.map((_,p)=>b.filter(x=>x===p).length)}}};
function phRun(r,k){const st={},out=[];for(const h of hs(r)){const v=PH[k].f(r,h,st);if(v)out.push([h,v])}return out}
const phTot=(r,run)=>r.players.map((_,p)=>run.reduce((a,[,v])=>a+(v[p]||0),0));
function gPH(k){return r=>{const run=phRun(r,k);
  if(!run.length)return{res:k==="greenies"?"Marcá el greenie en los par 3":k==="bbb"?"Marcá Bingo, Bango y Bongo en cada hoyo":"Sin hoyos todavía",lines:[]};
  const t=phTot(r,run),order=ids(r).sort((a,b)=>t[b]-t[a]);
  if(k==="fidget"){const z=ids(r).filter(p=>!t[p]);return{res:z.length?`Sin ganar un hoyo: ${z.map(p=>nm(r,p)).join(", ")}`:"Todos ganaron al menos un hoyo",lines:order.map(p=>[nm(r,p),t[p]+" hoyo"+(t[p]===1?"":"s")+" ganado"+(t[p]===1?"":"s")])}}
  const top=t[order[0]],lead=order.filter(p=>t[p]===top);
  return{res:lead.length===r.players.length?`Empatados en ${fmtPt(top)}`:`Lidera ${lead.map(p=>nm(r,p)).join(" y ")} con ${fmtPt(top)}`,lines:order.map(p=>[nm(r,p),fmtPt(t[p])+" pts"])}}}
const chPH=k=>r=>{const run=phRun(r,k),m=new Map(run);if(!run.length)return"";const l=run.map(([h])=>h);
  return chLines(hl(l),playerSer(r,l,(h,p)=>m.get(h)[p],x=>fmtPt(x)+" pts",true),"Puntos acumulados")};
// Puntos por hoyo entre las dos parejas: [pareja A, pareja B]
const TH={
 lowhigh:(r,h)=>{const[A,B]=r.teams,x=best(r,h,A),y=best(r,h,B),wa=Math.max(...A.map(p=>sc(r,h,p))),wb=Math.max(...B.map(p=>sc(r,h,p)));return[(x<y)+(wa<wb),(y<x)+(wb<wa)]},
 scotch:(r,h)=>{const[A,B]=r.teams,x=best(r,h,A),y=best(r,h,B),s1=sum(r,h,A),t=sum(r,h,B),bA=A.some(p=>sc(r,h,p)<PP(r,p)[h]),bB=B.some(p=>sc(r,h,p)<PP(r,p)[h]);
   return[2*(x<y)+2*(s1<t)+(bA&&!bB),2*(y<x)+2*(t<s1)+(bB&&!bA)]}};
const thRun=(r,k)=>doneH(r).map(h=>[h,TH[k](r,h)]);
function gTH(k){return r=>{const run=thRun(r,k);if(!run.length)return{res:"Sin hoyos completos",lines:[]};const a=run.reduce((s,[,v])=>s+v[0],0),b=run.reduce((s,[,v])=>s+v[1],0);

const chTH=k=>r=>{const run=thRun(r,k);let d=0;return chBars(hl(run.map(([h])=>h)),run.map(([,v])=>d+=v[0]-v[1]),"Arriba "+tn(r,r.teams[0]),"Arriba "+tn(r,r.teams[1]),"Diferencia de puntos acumulada")};
// Todos contra todos: un match play por cada par de jugadores
function rrMatches(r){const out=[];for(let i=0;i<r.players.length;i++)for(let j=i+1;j<r.players.length;j++)
  out.push({i,j,m:matchPlay(r,hs(r),h=>sc(r,h,i),h=>sc(r,h,j),nm(r,i),nm(r,j))});return out}
function gRR(r){const ms=rrMatches(r),pts=r.players.map(()=>0);

  return{res:ms.some(x=>x.m.done)?`Lidera ${order.filter(p=>pts[p]===top).map(p=>nm(r,p)).join(" y ")} con ${fmtPt(top)}`:"Ningún partido terminado todavía",
    lines:[...order.map(p=>[nm(r,p),fmtPt(pts[p])+" pts"]),...ms.map(({i,j,m})=>[`${nm(r,i)} vs ${nm(r,j)}`,m.txt])]}}
const GFN={rr:gRR,stab2:gPH("stab2"),nines:gPH("nines"),acey:gPH("acey"),chairman:gPH("chairman"),fidget:gPH("fidget"),garbage:gPH("garbage"),greenies:gPH("greenies"),bbb:gPH("bbb"),lowhigh:gTH("lowhigh"),scotch:gTH("scotch"),
 medal:gMedal,fourball:gFourball,nassau:gNassau,skins:gSkins,sixes:gSixes,vegas:gVegas,wolf:gWolf,rabbit:gRabbit,snake:gSnake,bba:gBBA,stableford:gStableford};

  for(let v=Math.floor(lo/st+1e-9)*st;v<=Math.ceil(hi/st-1e-9)*st+1e-9;v+=st)t.push(Math.round(v*100)/100);return t}
function chartBox(xl,ticks,draw,label,seps,xt){const n=xl.length,w=CW-CL-CR,h=CHT-CT-CB,bw=w/n,lo=ticks[0],hi=ticks[ticks.length-1];

  (seps||[]).forEach(i=>s+=`<line class="sep" x1="${CL+i*bw}" x2="${CL+i*bw}" y1="${CT}" y2="${CT+h}"/>`);
  xl.forEach((l,i)=>s+=`<text x="${X(i)}" y="${CT+h+14}" text-anchor="middle">${l}</text>`);

const legLine=items=>`<div class="legend">${items.map(([n,c,d])=>`<span><svg width="20" height="8" aria-hidden="true"><line x1="1" x2="19" y1="4" y2="4" stroke="${c}" stroke-width="3" stroke-dasharray="${d}"/></svg>${esc(n)}</span>`).join("")}</div>`;

  return legLine(ser.map(s=>[s.n,s.c,s.dots?"1 5":s.d]))+chartBox(xl,t,(X,Y)=>ser.map(s=>{const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);

// v: ventaja acumulada por hoyo (positiva = la primera pareja)

    return v.map((x,i)=>x===0?`<rect class="zero" x="${X(i)-wd/2}" y="${z-1}" width="${wd}" height="2" rx="1"/>`:`<rect x="${X(i)-wd/2}" y="${Math.min(Y(x),z)}" width="${wd}" height="${Math.abs(Y(x)-z)}" rx="3" style="fill:var(${x>0?"--ta":"--tb"})"/>`).join("")},label,seps)}

function chStrip(r,xl,hold,label,seps){if(!xl.length)return"";const w=CW-CL-CR,bw=w/xl.length;

  hold.forEach((p,i)=>{const x=CL+i*bw;s+=`<rect x="${x+1.5}" y="4" width="${bw-3}" height="22" rx="3" ${p==null?'class="empty"':`style="fill:var(--c${p%8+1})"`}/>`+(p==null?"":`<text class="in" x="${x+bw/2}" y="19" text-anchor="middle">${esc(nm(r,p).charAt(0).toUpperCase())}</text>`)+`<text x="${x+bw/2}" y="41" text-anchor="middle">${xl[i]}</text>`});

const doneH=r=>{const o=[];for(const h of hs(r)){if(!comp(r,h))break;o.push(h)}return o};
const hl=l=>l.map(h=>h+1);

function playerSer(r,l,step,fmt,desc){return ids(r).map(p=>{let c=0;const v=l.map(h=>{const x=step(h,p);if(x==null)return null;c+=x;return c});
  const last=[...v].reverse().find(x=>x!=null);return{p,v,last,n:nm(r,p)+(last==null?"":" "+fmt(last)),c:pc(p),d:PD[p%8]}}).filter(s=>s.last!=null).sort((a,b)=>desc?b.last-a.last:a.last-b.last)}
function chToPar(r){const L=hs(r);let k=-1;L.forEach((h,i)=>{if(r.d[h].some(x=>x.s!=null))k=i});if(k<0)return"";const l=L.slice(0,k+1);
  return chLines(hl(l),playerSer(r,l,(h,p)=>{const s=sc(r,h,p);return s==null?null:s-PP(r,p)[h]},toPar),"Golpes sobre el par acumulados, hoyo a hoyo")}

/* ---------- hándicap ---------- */
const pkey=n=>String(n).trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const fmt1=x=>x.toFixed(1).replace(".",",");
const ddmm=d=>d.slice(8)+"/"+d.slice(5,7);
// Vueltas de 9 o 18 hoyos completas del jugador, en orden cronológico
function hcpRounds(name,isMe){const key=pkey(name),out=[];
  S.rounds.forEach(r=>{const p=isMe&&r.me!=null?r.me:r.players.findIndex(n=>pkey(n)===key);if(p<0||(r.n!==9&&r.n!==18))return;const o=stats(r,p);if(o.n===r.n)out.push({date:r.date,n:r.n,tp:o.s-o.par})});
  return out.map((x,i)=>({...x,i})).sort((a,b)=>a.date.localeCompare(b.date)||a.i-b.i)}
// Tarjetas de 18: las de 9 se juntan de a dos en orden cronológico
function hcpCards(rs){const cards=[];let wait=null;
  rs.forEach(x=>{if(x.n===18)cards.push({date:x.date,tp:x.tp,lab:"18 hoyos"});
    else if(wait){cards.push({date:x.date,tp:wait.tp+x.tp,lab:`9 + 9 (${ddmm(wait.date)} y ${ddmm(x.date)})`});wait=null}else wait=x});
  return{cards,wait}}
// Tabla WHS según la cantidad de tarjetas: [cuántas mejores se promedian, ajuste]
const whsUse=n=>n<3?null:n===3?[1,-2]:n===4?[1,-1]:n===5?[1,0]:n===6?[2,-1]:n<=8?[2,0]:n<=11?[3,0]:n<=14?[4,0]:n<=16?[5,0]:n<=18?[6,0]:n===19?[7,0]:[8,0];
function whsIdx(d){const u=whsUse(d.length);if(!u)return null;const s=[...d].sort((a,b)=>a-b).slice(0,u[0]);return Math.round((s.reduce((a,b)=>a+b,0)/u[0]+u[1])*10)/10}
function vHcp(name,isMe){const{cards,wait}=hcpCards(hcpRounds(name,isMe)),n=cards.length;
  const ev=cards.map((c,k)=>whsIdx(cards.slice(Math.max(0,k-19),k+1).map(x=>x.tp))),cur=n?ev[n-1]:null;
  const pend=wait?`<p class="note">La vuelta de 9 del ${ddmm(wait.date)} (${toPar(wait.tp)}) espera pareja.</p>`:"";
  const foot=`<p class="note">Estimado: usa el par en lugar del course rating y el slope.</p>`;
  if(cur==null)return`<div class="tile"><div class="label">Hándicap estimado · ${esc(name)}</div><div class="sub" style="margin-top:6px">Hacen falta 3 tarjetas de 18 hoyos (o dos de 9 por cada una). Tiene ${n}.</div>${pend}${foot}</div>`;
  const prev=n>1?ev[n-2]:null,dl=prev==null?null:Math.round((cur-prev)*10)/10;
  const last=cards.slice(-20),u=whsUse(last.length),best=new Set(last.map((c,i)=>[c.tp,i]).sort((a,b)=>a[0]-b[0]||b[1]-a[1]).slice(0,u[0]).map(x=>x[1]));
  const k0=ev.findIndex(x=>x!=null),cs=cards.slice(k0),every=Math.ceil(cs.length/6);
  const xl=cs.map((c,i)=>(cs.length-1-i)%every===0?ddmm(c.date):"");
  const chart=chLines(xl,[{n:"Índice "+fmt1(cur),v:ev.slice(k0),c:getVar("--accent"),d:""},{n:"Cada tarjeta (sobre par)",v:cs.map(c=>c.tp),c:getVar("--muted"),d:"",dots:true}],"Evolución del hándicap estimado",1,{xt:"Tarjeta",free:true});
  return`<div class="tile"><div class="label">Hándicap estimado · ${esc(name)}</div>
   <div class="row" style="align-items:baseline;gap:10px;margin-top:4px"><div class="big">${fmt1(cur)}</div>${dl==null?"":`<div class="sub">${dl===0?"igual que":dl<0?`▼ ${fmt1(-dl)} desde`:`▲ ${fmt1(dl)} desde`} la tarjeta anterior</div>`}</div>
   <div class="sub">${u[0]===1?"La mejor":`Promedio de las ${u[0]} mejores`} de las últimas ${last.length} tarjetas${u[1]?` (${u[1]})`:""}</div>
   <div class="chartwrap">${chart}</div>${pend}
   <details class="rule"><summary>Tarjetas que cuentan</summary><div class="g-lines" style="margin-top:6px">${last.map((c,i)=>[c,i]).reverse().map(([c,i])=>`<div${best.has(i)?' class="best"':""}><span>${ddmm(c.date)} · ${esc(c.lab)}</span><span>${toPar(c.tp)}${best.has(i)?" ✓":""}</span></div>`).join("")}</div></details>${foot}</div>`}

/* ---------- stats ---------- */
function stats(r,p){const o={s:0,par:0,n:0,fw:0,fwN:0,fwL:0,fwR:0,gir:0,girN:0,putts:0,pN:0,three:0,one:0,pen:0,bk:0,ss:0,dist:{e:0,b:0,p:0,bo:0,d:0,t:0},pt:{3:[0,0],4:[0,0],5:[0,0]}};
  hs(r).forEach(h=>{const x=r.d[h][p],par=PP(r,p)[h];if(x.s==null)return;o.s+=x.s;o.par+=par;o.n++;
    const d=x.s-par;o.dist[d<=-2?"e":d===-1?"b":d===0?"p":d===1?"bo":d===2?"d":"t"]++;o.pt[par][0]+=x.s;o.pt[par][1]++;
    if(par>=4&&x.fw){o.fwN++;if(x.fw==="c")o.fw++;else if(x.fw==="l")o.fwL++;else o.fwR++}
    if(x.p!=null){o.pN++;o.putts+=x.p;if(x.p>=3)o.three++;if(x.p===1)o.one++;o.girN++;if(x.s-x.p<=par-2)o.gir++}
    o.pen+=x.pen||0;if(x.bk){o.bk++;if(x.s<=par)o.ss++}});return o}

const zeroStats=()=>({s:0,par:0,n:0,fw:0,fwN:0,fwL:0,fwR:0,gir:0,girN:0,putts:0,pN:0,three:0,one:0,pen:0,bk:0,ss:0,dist:{e:0,b:0,p:0,bo:0,d:0,t:0},pt:{3:[0,0],4:[0,0],5:[0,0]}});

function vStatsAll(){const ps=people();

  const sc18=r18.length?tile("Promedio de 18",fmt1(mean(r18,e=>e.x.s)),`${toPar(Math.round(mean(r18,e=>e.x.s-e.x.par)))} · mejor ${best(r18).x.s} (${toPar(best(r18).x.s-best(r18).x.par)}) el ${ddmm(best(r18).r.date)}`)

    <p class="note">Por golpes totales en las vueltas completas que jugaron juntos. Dif. es el promedio de golpes de ${esc(who.name)} contra cada uno: negativo, le saca ventaja.</p>`:"";

// Ganadores de cada juego en una vuelta terminada: [{pl:jugadores, w:ganadores}] (Snake: l = quien perdió)
function gWin(k,r){const all=ids(r),[A,B]=r.teams,top=(v,hi)=>{const m=hi?Math.max(...v):Math.min(...v);if(v.every(x=>x===m))return[];return all.filter(p=>v[p]===m)};
  const team=(x)=>x>0?A:x<0?B:[],teamsAll=[...A,...B],L=hs(r);
  switch(k){
   case"medal":{const t=all.map(p=>{const x=stats(r,p);return x.n===r.n?x.s-x.par:null});if(t.some(x=>x==null))return[];return[{pl:all,w:top(t,false)}]}
   case"fourball":{const m=matchPlay(r,L,h=>best(r,h,A),h=>best(r,h,B),"","");return m.done?[{pl:teamsAll,w:m.winner===0?A:m.winner===1?B:[]}]:[]}
   case"nassau":{const parts=r.n===18?[L.slice(0,9),L.slice(9),L]:[L];let a=0,b=0;parts.forEach(l=>{const m=matchPlay(r,l,h=>best(r,h,A),h=>best(r,h,B),"","");if(m.winner===0)a++;else if(m.winner===1)b++});return[{pl:teamsAll,w:team(a-b)}]}
   case"skins":{const won=all.map(()=>0);let carry=0;L.forEach(h=>{carry++;const w=lowWinner(r,h);if(w>=0){won[w]+=carry;carry=0}});return[{pl:all,w:won.some(x=>x)?top(won,true):[]}]}
   case"sixes":{const seg=r.n/3,pts=[0,0,0,0];[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]].forEach(([X,Y],i)=>{const m=matchPlay(r,L.slice(i*seg,(i+1)*seg),h=>best(r,h,X),h=>best(r,h,Y),"","");if(m.winner===0)X.forEach(p=>pts[p]++);else if(m.winner===1)Y.forEach(p=>pts[p]++)});return[{pl:all,w:top(pts,true)}]}
   case"vegas":{let pts=0;L.forEach(h=>{const bA=A.some(p=>sc(r,h,p)<PP(r,p)[h]),bB=B.some(p=>sc(r,h,p)<PP(r,p)[h]);pts+=vnum(sc(r,h,B[0]),sc(r,h,B[1]),bA&&!bB)-vnum(sc(r,h,A[0]),sc(r,h,A[1]),bB&&!bA)});return[{pl:teamsAll,w:team(pts)}]}
   case"wolf":{if(!L.some(h=>r.wolf[h]!=null))return[];const pts=[0,0,0,0];L.forEach((h,i)=>{const w=i%4,dec=r.wolf[h];if(dec==null)return;const others=all.filter(p=>p!==w);
     if(typeof dec==="number"){const X=[w,dec],Y=others.filter(p=>p!==dec),a=best(r,h,X),b=best(r,h,Y);if(a<b)X.forEach(p=>pts[p]++);else if(b<a)Y.forEach(p=>pts[p]++)}

   case"incopy":keepIncoming(true);scrollTop=true;break;
   case"indrop":ui.incoming=null;ui.inCourse=null;clearHash();S.view=S.rounds.length?"games":"rounds";scrollTop=true;break;
   case"exp":ui.exp=!ui.exp;break;
   case"bkfile":backupFile();return
   case"live":S.view="games";S.gamesMode="round";scrollTop=true;break;
   case"img":{const t=S.rounds.find(x=>x.id===v)||r;if(t)openImage(t);return}
   case"imgshare":{const m=ui.img;if(m)giveFile(m.blob,m.name,"Mulligan").then(ok=>{if(ok===null)toast("No se pudo compartir la imagen")});return}
   case"imgclose":closeImg();break;
   case"a2hsoff":S.a2hsOff=true;break;
   case"install":{const ev=installEv;if(!ev)return;ev.prompt();ev.userChoice.then(c=>{installEv=null;if(c&&c.outcome==="accepted")S.a2hsOff=true;save();render()}).catch(()=>{});return}
   case"imp":ui.imp=!ui.imp;ui.impErr="";break;
   case"copy":{const t=document.getElementById("exp-text");const done=()=>{b.textContent="Copiado"};
     try{navigator.clipboard.writeText(t.value).then(()=>{done();markBackup();save()},()=>{t.select();b.textContent="Seleccionado: copialo"})}catch(err){t.select();b.textContent="Seleccionado: copialo"}return}
   case"impok":doImport(document.getElementById("imp-text").value);break;
   default:return}
  if(["s","sset","pt","pen","fw","bk","go","wolf","bbb","grn"].includes(a))vib(8);if(a==="close")vib([30,40,30]);
  save();render();if(scrollTop)window.scrollTo(0,0)}
function doImport(txt){try{const j=JSON.parse(txt);if(!j||!Array.isArray(j.rounds)||!j.rounds.length||!j.rounds.every(r=>r.d&&r.players))throw 0;
  S=norm(j);markBackup();if(!S.rounds.some(r=>r.id===S.cur))S.cur=S.rounds[0].id;S.view="rounds";ui.imp=false;ui.impErr=""}
  catch(e){ui.impErr="El texto no es una copia válida de la app. Pegá el texto completo que exportaste."}}
function onSubmit(e){if(e.target.id==="cform"){e.preventDefault();saveCourse();return}if(e.target.id!=="setup")return;e.preventDefault();readDraft();const d=ui.draft;
  const players=d.players.map(p=>p.name.trim());
  if(players.some(x=>!x)){ui.setupErr="Completá el nombre de todos los jugadores, o quitá los que sobran.";render();return}
  const A=[],B=[];d.players.forEach((p,i)=>(p.team==="A"?A:B).push(i));
  const me=d.players.findIndex(p=>p.me),meI=me<0?null:me;
  const c=draftC(d),course=c.id,tees=d.players.map(p=>has(c.tees,p.tee)?p.tee:has(c.tees,d.tee)?d.tee:defTee(c)),tee=tees.slice().sort((a,b)=>tees.filter(x=>x===b).length-tees.filter(x=>x===a).length)[0];if(meI!=null)S.meName=players[meI];S.statsP=meI||0;
  const games={};GAMES.forEach(([k])=>games[k]=!!d.games[k]&&!gameOk(k,players.length,A.length,B.length,d.holes==="18"?18:9));
  if(d.edit){const r=S.rounds.find(x=>x.id===d.edit);if(r){const old=r.d;
    r.d=Array.from({length:18},(_,h)=>d.players.map(p=>p.orig!=null&&old[h][p.orig]?old[h][p.orig]:{s:null,p:null,fw:null,pen:0,bk:false}));
    if(!(d.players.length===r.players.length&&d.players.every((p,i)=>p.orig===i))){r.wolf={};r.bbb={};r.grn={}}
    Object.assign(r,{course,date:d.date||r.date,players,teams:[A,B],start:d.holes==="back"?9:0,n:d.holes==="18"?18:9,games,tee,tees,me:meI});r.cur=Math.min(r.cur,r.n-1);S.cur=r.id}
    S.view="games";ui.setupErr="";ui.draft=null;save();render();window.scrollTo(0,0);return}
  const r=newRound({date:d.date||todayIso(),players,teams:[A,B],start:d.holes==="back"?9:0,n:d.holes==="18"?18:9,games});r.course=course;r.tee=tee;r.tees=tees;r.me=meI;
  S.rounds.push(r);S.cur=r.id;S.view="hole";ui.setupErr="";ui.draft=null;save();render();window.scrollTo(0,0)}
function onChange(e){
  if(e.target.id==="histsel"){S.histRound=e.target.value||null;save();render();return}
  if(e.target.id==="su-holes"&&ui.draft){readDraft();render();return}
  if(e.target.id==="su-tee"&&ui.draft){readDraft();ui.draft.players.forEach(q=>q.tee=ui.draft.tee);render();return}
  if(e.target.id==="su-course"&&ui.draft){readDraft();const v=e.target.value;
    if(v==="__new"){openCourse(null,"setup");render();window.scrollTo(0,0);return}
    const c=courseById(v);if(c)setDraftCourse(ui.draft,c);render();return}
  if(e.target.id==="ce-own"&&ui.cdraft){readCDraft();const d=ui.cdraft,t=d.tees[d.sel];t.own=!t.own;
    if(t.own&&!t.par.length){t.par=d.par.slice();t.si=d.si.slice()}render();return}
  if(e.target.id==="imp-file"){const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{doImport(String(fr.result));save();render()};fr.readAsText(f)}}
function init(){S=load();if(!S.view)S.view="games";document.addEventListener("click",onClick);document.addEventListener("submit",onSubmit);document.addEventListener("change",onChange);render();keepAwake();
  document.addEventListener("visibilitychange",keepAwake);document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ui.themes||ui.img)){ui.themes=false;closeImg();render()}cKey(e)});
  document.addEventListener("input",cInput);document.addEventListener("focusin",e=>{if(e.target.closest&&e.target.closest("table.cedit"))setTimeout(()=>{try{e.target.select()}catch(x){}},0)});
  const app=document.getElementById("app");app.addEventListener("touchstart",onTouchStart,{passive:true});app.addEventListener("touchend",onTouchEnd,{passive:true});
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.mode==="sistema")render()})}catch(e){}
  checkHash();window.addEventListener("hashchange",checkHash);askPersist();
  // Android y la compu ofrecen instalarla: el botón aparece en el aviso de Vueltas
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;if(S.view==="rounds")render()});
  window.addEventListener("appinstalled",()=>{installEv=null;S.a2hsOff=true;save();if(S.view==="rounds")render()});
  // Instalable y sin conexión cuando se sirve desde el sitio (no dentro de Claude)
  if(CANSHARE&&"serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){const had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").then(reg=>document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})})).catch(()=>{});
    // Cuando entra una versión nueva (no la primera instalación), se avisa y se recarga con un toque
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)showUpdate()})}}
// Grilla de hoyos: Enter baja al hoyo siguiente en la misma columna y el par (un solo dígito) pasa solo
const cNext=(col,h)=>{const n=document.getElementById(col+(h+1));if(n)n.focus();else document.activeElement.blur()};
function cKey(e){const m=e.key==="Enter"&&e.target.id&&e.target.id.match(/^(ce-(?:par|si|m))(\d+)$/);
  if(m){e.preventDefault();cNext(m[1],+m[2]);return}
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("#cform")&&e.target.tagName==="INPUT"){e.preventDefault();e.target.blur()}}
function cInput(e){const id=e.target.id||"";if(!id.startsWith("ce-"))return;updCSums();
  const m=id.match(/^ce-par(\d+)$/);if(m&&/^[3-5]$/.test(e.target.value))cNext("ce-par",+m[1])}
/* ---------- detalles del celular ---------- */
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let toastT=null;
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
// Con una vuelta en juego la pantalla no se apaga sola
let wake=null;
async function keepAwake(){const r=R(),on=!!r&&!r.closed&&document.visibilityState==="visible";
  try{if(on&&!wake&&"wakeLock"in navigator){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}else if(!on&&wake){await wake.release();wake=null}}catch(e){wake=null}}
// En la pantalla del hoyo, deslizar cambia de hoyo
let touch0=null;
function onTouchStart(e){if(S.view!=="hole"||e.touches.length!==1){touch0=null;return}const t=e.touches[0];touch0={x:t.clientX,y:t.clientY}}
function onTouchEnd(e){if(!touch0||S.view!=="hole")return;const t=e.changedTouches[0],dx=t.clientX-touch0.x,dy=t.clientY-touch0.y;touch0=null;
  if(Math.abs(dx)<70||Math.abs(dy)>45)return;const r=R();if(!r)return;const k=Math.max(0,Math.min(r.n-1,r.cur+(dx<0?1:-1)));if(k===r.cur)return;
  r.cur=k;vib(8);save();render();window.scrollTo(0,0)}
// build.py reemplaza la marca por el número de versión del sitio
const VERSION="846be1a3a1";
async function checkUpdate(){let reg=null;try{reg=await navigator.serviceWorker.getRegistration()}catch(e){}
  if(!reg){toast("Sin conexión con el sitio: probá de nuevo con señal.");return}toast("Buscando…");
  try{await reg.update()}catch(e){toast("Sin señal: no se pudo buscar.");return}
  toast(reg.installing||reg.waiting?"Bajando la versión nueva…":"Ya tenés la última versión")}
function showUpdate(){if(document.getElementById("upd"))return;const el=document.createElement("div");el.id="upd";el.className="upd";el.setAttribute("role","status");
  el.innerHTML=`<span>Hay una versión nueva de la app</span><button class="btn small primary" data-a="reload">Actualizar</button>`;document.body.appendChild(el)}
if(typeof document!=="undefined"&&document.getElementById("app"))init();
</script>
